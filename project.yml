# [LISTN] project.yml
# Target: XcodeGen iOS Application Specification
name: KSign
options:
  bundleIdPrefix: com.ksign
  deploymentTarget:
    iOS: "15.0"
  xcodeVersion: "15.4"
  createIntermediateGroups: true

packages:
  OpenSSL:
    url: https://github.com/krzyzanowskim/OpenSSL.git
    from: 1.1.2300

targets:
  KSign:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: Sources
      - path: Resources
    dependencies:
      - package: OpenSSL
      - sdk: Security.framework
      - sdk: Network.framework
      - sdk: UniformTypeIdentifiers.framework
      - sdk: libz.tbd
    settings:
      base:
        PRODUCT_NAME: KSign
        PRODUCT_BUNDLE_IDENTIFIER: com.ksign.signer
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "5.9"
        CLANG_CXX_LANGUAGE_STANDARD: "c++20"
        CLANG_CXX_LIBRARY: "libc++"
        SWIFT_OBJC_BRIDGING_HEADER: Sources/KSignApp/KSign-Bridging-Header.h
        HEADER_SEARCH_PATHS:
          - $(SRCROOT)/Sources/CoreSignEngine/include
        INFOPLIST_FILE: Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: Resources/KSign.entitlements
        ENABLE_BITCODE: "NO"
        ALWAYS_SEARCH_USER_PATHS: "NO"
        GCC_PREPROCESSOR_DEFINITIONS:
          - $(inherited)
          - CODESIGN_IOS=1
