# [LISTN] project.yml
# Target: XcodeGen iOS Application Specification
name: KSign
options:
  bundleIdPrefix: com.ksign
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true

targets:
  KSign:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: Sources
      - path: Resources
    dependencies:
      - framework: Frameworks/OpenSSL.xcframework
      - sdk: Security.framework
      - sdk: Network.framework
      - sdk: UniformTypeIdentifiers.framework
      - sdk: libz.tbd
    settings:
      base:
        PRODUCT_NAME: KSign
        PRODUCT_BUNDLE_IDENTIFIER: com.ksign.signer
        MARKETING_VERSION: 1.0.0
        CURRENT_PROJECT_VERSION: 1
        SWIFT_VERSION: "5.9"
        CLANG_CXX_LANGUAGE_STANDARD: "c++20"
        CLANG_CXX_LIBRARY: "libc++"
        SWIFT_OBJC_BRIDGING_HEADER: Sources/KSignApp/KSign-Bridging-Header.h
        HEADER_SEARCH_PATHS:
          - $(SRCROOT)/Sources/CoreSignEngine/include
          - $(SRCROOT)/Frameworks/include
        INFOPLIST_FILE: Resources/Info.plist
        CODE_SIGN_STYLE: "Manual"
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGNING_ALLOWED: "YES"
        ENABLE_BITCODE: "NO"
        ALWAYS_SEARCH_USER_PATHS: "NO"
        GCC_PREPROCESSOR_DEFINITIONS:
          - $(inherited)
          - CODESIGN_IOS=1
